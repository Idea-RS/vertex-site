<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .border { stroke: #778DA9; stroke-width: 1.5; fill: none; }
      .solid-geom { stroke: #E0E1DD; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .hidden-geom { stroke: #778DA9; stroke-width: 1; stroke-dasharray: 4 2; fill: none; }
      .centerline { stroke: #415A77; stroke-width: 0.8; stroke-dasharray: 12 3 3 3; }
      .dim-line { stroke: #F0A868; stroke-width: 1; fill: none; }
      .dim-text { font-family: monospace; font-size: 11px; fill: #F0A868; text-anchor: middle; }
      .label-text { font-family: sans-serif; font-size: 12px; fill: #778DA9; letter-spacing: 0.05em; font-weight: 500; }
      .redaction-bar { fill: #1B263B; stroke: #415A77; stroke-width: 1; }
      .hatch { stroke: #415A77; stroke-width: 0.75; }
    </style>
    <marker id="arrowB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#F0A868" />
    </marker>
  </defs>

  <!-- Sheet Background -->
  <rect width="800" height="600" fill="#0D1B2A" />

  <!-- Sheet Border -->
  <rect x="20" y="20" width="760" height="560" class="border" />
  <rect x="25" y="25" width="750" height="550" class="border" stroke-width="0.75" />

  <!-- Cylindrical Coupling Front View -->
  <g id="part-b-front" transform="translate(80, 90)">
    <text x="110" y="20" class="label-text">VIEW 1 — ELEVATION</text>
    <!-- Stepped cylinder profile -->
    <path class="solid-geom" d="M 30,70 L 80,70 L 80,45 L 140,45 L 140,70 L 190,70 L 190,170 L 140,170 L 140,195 L 80,195 L 80,170 L 30,170 Z" />
    <circle cx="110" cy="120" r="32" class="solid-geom" />
    <circle cx="110" cy="120" r="14" class="solid-geom" />
    <!-- Flange bolt circle (4 holes) -->
    <circle cx="110" cy="65" r="4" class="solid-geom" />
    <circle cx="110" cy="175" r="4" class="solid-geom" />
    <circle cx="55" cy="120" r="4" class="solid-geom" />
    <circle cx="165" cy="120" r="4" class="solid-geom" />
    <!-- Centerlines -->
    <line x1="15" y1="120" x2="205" y2="120" class="centerline" />
    <line x1="110" y1="30" x2="110" y2="210" class="centerline" />
    <!-- Dimension -->
    <line x1="30" y1="210" x2="30" y2="230" class="dim-line" />
    <line x1="190" y1="210" x2="190" y2="230" class="dim-line" />
    <line x1="30" y1="220" x2="190" y2="220" class="dim-line" marker-start="url(#arrowB)" marker-end="url(#arrowB)" />
    <text x="110" y="235" class="dim-text">160.00 mm</text>
  </g>

  <!-- Section View -->
  <g id="part-b-section" transform="translate(360, 90)">
    <text x="130" y="20" class="label-text">SECTION A-A</text>
    <!-- Cross section of collar -->
    <path class="solid-geom" d="M 40,55 L 220,55 L 220,85 L 170,85 L 170,155 L 220,155 L 220,185 L 40,185 L 40,155 L 90,155 L 90,85 L 40,85 Z" />
    <line x1="20" y1="120" x2="240" y2="120" class="centerline" />
    <!-- Hatching -->
    <line x1="45" y1="60" x2="65" y2="80" class="hatch" />
    <line x1="60" y1="60" x2="80" y2="80" class="hatch" />
    <line x1="75" y1="60" x2="85" y2="70" class="hatch" />
    <line x1="175" y1="60" x2="195" y2="80" class="hatch" />
    <line x1="190" y1="60" x2="210" y2="80" class="hatch" />
    <!-- Dimension -->
    <line x1="230" y1="55" x2="250" y2="55" class="dim-line" />
    <line x1="230" y1="185" x2="250" y2="185" class="dim-line" />
    <line x1="240" y1="55" x2="240" y2="185" class="dim-line" marker-start="url(#arrowB)" marker-end="url(#arrowB)" />
    <text x="240" y="124" class="dim-text" transform="rotate(90, 240, 124)">130.00 mm</text>
  </g>

  <!-- Redacted Title Block -->
  <g id="part-b-title" transform="translate(480, 440)">
    <rect x="0" y="0" width="295" height="135" class="border" fill="#0D1B2A" />
    <line x1="0" y1="45" x2="295" y2="45" class="border" />
    <line x1="0" y1="90" x2="295" y2="90" class="border" />
    <line x1="150" y1="45" x2="150" y2="135" class="border" />
    <!-- Redaction Bars -->
    <rect x="15" y="12" width="265" height="22" class="redaction-bar" rx="3" />
    <rect x="15" y="55" width="120" height="18" class="redaction-bar" rx="3" />
    <rect x="165" y="55" width="115" height="18" class="redaction-bar" rx="3" />
    <rect x="15" y="100" width="120" height="18" class="redaction-bar" rx="3" />
    <text x="165" y="105" font-family="monospace" font-size="10" fill="#778DA9">SCALE 1:2</text>
    <text x="165" y="120" font-family="monospace" font-size="10" fill="#778DA9">SHEET 1 OF 1</text>
    <text x="235" y="120" font-family="monospace" font-size="10" fill="#F0A868">PART B</text>
  </g>
</svg>
